[project]
name = "prompt-composer"
version = "0.1.0"
description = "Section-based prompt composition and slot variable management for LLM applications"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "phonhay103", email = "phonhay103@users.noreply.github.com" }
]
keywords = ["prompt", "llm", "template", "composition", "sections"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
]

# NOTE: `magic-detector` is an optional, non-PyPI integration used only by
# `DefaultFormatDetector` for advanced file-type detection. It is intentionally
# NOT declared as a dependency here because:
#   1. PyPI rejects direct URL (git) dependencies in `requires_dist`.
#   2. The name `magic-detector` on PyPI is an unrelated placeholder package.
# The package degrades gracefully to built-in extension/heuristic detection when
# it is not installed. See README "Optional: advanced format detection".
# To enable it in a local/dev environment:
#   uv pip install "magic-detector @ git+https://github.com/phonhay103/json-schema-transformer.git@main#subdirectory=packages/magic_detector"

[project.urls]
Homepage = "https://github.com/phonhay103/prompt-composer"
Repository = "https://github.com/phonhay103/prompt-composer"
Issues = "https://github.com/phonhay103/prompt-composer/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.3.0",
    "ty>=0.0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "ANN",   # flake8-annotations (prevent Any via ANN401)
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify (simplify logic)
    "RUF",   # Ruff specific rules
]
ignore = [
    "ANN002", # Do not require type annotation for *args
    "ANN003", # Do not require type annotation for **kwargs
    "ANN401", # Dynamically typed expressions (typing.Any) are allowed

    # --- Resolve conflicts with Formatter ---
    "COM812", # Ignore missing trailing comma warnings (handled by formatter)
    "ISC002", # Ignore implicit string concatenation warnings

    # --- Design philosophy optimizing ruff format ---
    "E501",   # Ignore line length limit (delegated to ruff format)
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["prompt_composer"]

[tool.ruff.lint.per-file-ignores]
# Allow assert in testing, relax type annotation requirements
"tests/**/*.py" = ["S101", "S105", "S106", "ANN", "ARG", "E402", "SIM117", "RUF059", "W293", "I001"]
# Protect package initialization files from unused imports (keep exported imports)
"__init__.py" = ["F401"]
# Relax checks for example scripts
"templates/**/*.py" = ["SIM", "ARG"]

[tool.ty]

[tool.ty.src]
include = ["src"]
exclude = ["src/prompt_composer/formats/**"]

[tool.ty.rules]
all = "error"
