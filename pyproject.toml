[project]
name = "prompt-composer"
version = "0.1.0"
description = "Section-based prompt composition and slot variable management for LLM applications"
readme = "README.md"
license = "MIT"
authors = [{ name = "JSON Schema Transformer Team" }]
keywords = ["prompt", "llm", "template", "composition", "sections"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
    "magic-detector",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
magic-detector = { workspace = true }
